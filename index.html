<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Guide - Firebase Realtime Database</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1, h2 { color: #333; }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover { background-color: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li {
            background: #fff;
            margin: 8px 0;
            padding: 12px;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .btn-delete:hover { background: #bd2130; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Nuovo Appuntamento / Guida</h2>
        <input type="text" id="nomeStudente" placeholder="Nome e Cognome Studente" required>
        <input type="datetime-local" id="dataOra" required>
        <button id="btnSalva">Salva in Firebase</button>
    </div>

    <div class="card">
        <h2>Lista Appuntamenti (Sincronizzata Live)</h2>
        <ul id="listaAppuntamenti">
            <li>Caricamento dati...</li>
        </ul>
    </div>

    <!-- Firebase SDK Modular JS -->
    <script type="module">
        // Importazione delle funzioni necessarie da Firebase App e Realtime Database
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        // La tua configurazione Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBXXK6mvn4_4eY2NcogvLVhsih0hBDvGpU",
            authDomain: "agenda-guide.firebaseapp.com",
            projectId: "agenda-guide",
            storageBucket: "agenda-guide.firebasestorage.app",
            messagingSenderId: "46794941870",
            appId: "1:46794941870:web:24604cd526f9896409d43f"
        };

        // Inizializzazione di Firebase e del Database
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Riferimento al nodo 'appuntamenti' nel Database
        const appuntamentiRef = ref(database, 'appuntamenti');

        // Elementi DOM
        const inputNome = document.getElementById('nomeStudente');
        const inputDataOra = document.getElementById('dataOra');
        const btnSalva = document.getElementById('btnSalva');
        const listaUI = document.getElementById('listaAppuntamenti');

        // 1. SALVATAGGIO DATI
        btnSalva.addEventListener('click', () => {
            const nome = inputNome.value.trim();
            const dataOra = inputDataOra.value;

            if (!nome || !dataOra) {
                alert("Compila tutti i campi!");
                return;
            }

            // Genera una nuova chiave univoca all'interno di 'appuntamenti'
            const nuovoAppuntamentoRef = push(appuntamentiRef);
            
            set(nuovoAppuntamentoRef, {
                nome: nome,
                dataOra: dataOra,
                timestamp: Date.now()
            }).then(() => {
                inputNome.value = '';
                inputDataOra.value = '';
            }).catch((error) => {
                console.error("Errore durante il salvataggio:", error);
            });
        });

        // 2. LETTURA IN TEMPO REALE (Sincronizzazione automatica)
        onValue(appuntamentiRef, (snapshot) => {
            listaUI.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                listaUI.innerHTML = '<li>Nessun appuntamento registrato.</li>';
                return;
            }

            // Cicla tutti gli elementi presenti nel database
            Object.keys(data).forEach((key) => {
                const item = data[key];
                const li = document.createElement('li');
                
                li.innerHTML = `
                    <span><strong>${item.nome}</strong> — ${new Date(item.dataOra).toLocaleString('it-IT')}</span>
                    <button class="btn-delete" data-id="${key}">Elimina</button>
                `;
                
                listaUI.appendChild(li);
            });

            // Aggiunge l'evento di eliminazione ai pulsanti creati
            document.querySelectorAll('.btn-delete').forEach(button => {
                button.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    eliminaAppuntamento(id);
                });
            });
        });

        // 3. CANCELLAZIONE DATI
        function eliminaAppuntamento(id) {
            const itemRef = ref(database, `appuntamenti/${id}`);
            remove(itemRef);
        }
    </script>
</body>
</html>

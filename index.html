<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Guide - Scuola Guida</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-xl shadow-sm">
          <i class="fa-solid fa-car"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-none">Agenda Guide</h1>
          <p class="text-xs text-slate-500 mt-1">Gestione Prenotazioni Orarie</p>
        </div>
      </div>

      <!-- Data Picker & Search -->
      <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" placeholder="Cerca allievo o autoscuola..." 
            class="w-full pl-9 pr-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
        </div>
        <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg border border-slate-200">
          <button id="prevDay" class="p-2 text-slate-600 hover:text-brand-600 hover:bg-white rounded-md transition-all">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <input type="date" id="datePicker" class="bg-transparent border-0 text-sm font-semibold text-slate-700 focus:ring-0 cursor-pointer">
          <button id="nextDay" class="p-2 text-slate-600 hover:text-brand-600 hover:bg-white rounded-md transition-all">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Stats Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-lg bg-blue-50 text-brand-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-calendar-day"></i>
        </div>
        <div>
          <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Slot Totali</span>
          <p class="text-2xl font-bold text-slate-800" id="statTotal">7</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <div>
          <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Prenotate</span>
          <p class="text-2xl font-bold text-slate-800" id="statBooked">0</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-clock"></i>
        </div>
        <div>
          <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Libere</span>
          <p class="text-2xl font-bold text-slate-800" id="statFree">7</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-percent"></i>
        </div>
        <div>
          <span class="text-xs font-medium text-slate-500 uppercase tracking-wider">Occupazione</span>
          <p class="text-2xl font-bold text-slate-800" id="statOccupancy">0%</p>
        </div>
      </div>
    </div>

    <!-- Timeline Sections -->
    <div class="space-y-6">

      <!-- Mattina -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-sun text-amber-500"></i>
          <h2 class="font-bold text-slate-800">Mattina (09:00 - 12:00)</h2>
        </div>
        <div class="divide-y divide-slate-100" id="morningSlots"></div>
      </div>

      <!-- Pomeriggio -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-cloud-sun text-brand-500"></i>
          <h2 class="font-bold text-slate-800">Pomeriggio (14:00 - 18:00)</h2>
        </div>
        <div class="divide-y divide-slate-100" id="afternoonSlots"></div>
      </div>

    </div>

    <!-- Action Bar -->
    <div class="flex justify-between items-center pt-4 border-t border-slate-200 text-xs text-slate-500">
      <button id="exportBtn" class="flex items-center gap-1.5 hover:text-brand-600 transition-colors">
        <i class="fa-solid fa-download"></i> Esporta Dati (JSON)
      </button>
      <button id="clearDayBtn" class="flex items-center gap-1.5 text-red-500 hover:text-red-700 transition-colors">
        <i class="fa-solid fa-trash"></i> Svuota Giornata
      </button>
    </div>

  </main>

  <!-- Modal Prenotazione -->
  <div id="bookingModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden transform transition-all">
      <div class="bg-brand-600 text-white px-6 py-4 flex justify-between items-center">
        <div>
          <h3 class="font-bold text-lg" id="modalTitle">Prenota Guida</h3>
          <p class="text-xs text-brand-100" id="modalSub">Seleziona orario e allievo</p>
        </div>
        <button id="closeModal" class="text-brand-100 hover:text-white text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="bookingForm" class="p-6 space-y-4">
        <input type="hidden" id="modalTimeSlot">

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nome Allievo *</label>
          <input type="text" id="studentName" required placeholder="Es. Mario Rossi"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Autoscuola</label>
          <input type="text" id="schoolName" placeholder="Es. Sede Centrale, Filiale 2..."
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Patente</label>
          <select id="licenseType" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <option value="BE">Patente BE</option>
            <option value="A / A2 / A1">Patente A / A2 / A1</option>
            <option value="AM">Patente AM</option>
            <option value="C / CE">Patente C / CE</option>
            <option value="D / DE">Patente D / DE</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Stato Prenotazione</label>
          <select id="bookingStatus" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <option value="confirmed">Confermata</option>
            <option value="completed">Completata</option>
            <option value="cancelled">Annullata</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Note (opzionale)</label>
          <textarea id="bookingNotes" rows="2" placeholder="Es. Prima guida, manovre park, aggancio rimorchio..."
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" id="cancelModal" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 text-sm font-medium">
            Annulla
          </button>
          <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 text-sm font-medium shadow-sm">
            Salva Prenotazione
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Configurazione Slot Orari
    const SLOTS_CONFIG = [
      { id: "09:00", label: "09:00 - 10:00", period: "morning" },
      { id: "10:00", label: "10:00 - 11:00", period: "morning" },
      { id: "11:00", label: "11:00 - 12:00", period: "morning" },
      { id: "14:00", label: "14:00 - 15:00", period: "afternoon" },
      { id: "15:00", label: "15:00 - 16:00", period: "afternoon" },
      { id: "16:00", label: "16:00 - 17:00", period: "afternoon" },
      { id: "17:00", label: "17:00 - 18:00", period: "afternoon" }
    ];

    let currentDate = new Date().toISOString().split('T')[0];
    let bookings = JSON.parse(localStorage.getItem('driving_agenda_db')) || {};

    // Elementi DOM
    const datePicker = document.getElementById('datePicker');
    const searchInput = document.getElementById('searchInput');
    const morningContainer = document.getElementById('morningSlots');
    const afternoonContainer = document.getElementById('afternoonSlots');
    const bookingModal = document.getElementById('bookingModal');
    const bookingForm = document.getElementById('bookingForm');

    // Inizializzazione
    datePicker.value = currentDate;

    function saveToStorage() {
      localStorage.setItem('driving_agenda_db', JSON.stringify(bookings));
    }

    function renderAgenda() {
      morningContainer.innerHTML = '';
      afternoonContainer.innerHTML = '';

      const dayBookings = bookings[currentDate] || {};
      const filterTerm = searchInput.value.toLowerCase().trim();

      let bookedCount = 0;

      SLOTS_CONFIG.forEach(slot => {
        const data = dayBookings[slot.id];
        const isBooked = !!data;

        if (isBooked) bookedCount++;

        // Filtro di ricerca
        if (filterTerm && isBooked) {
          const match = data.name.toLowerCase().includes(filterTerm) ||
                        (data.school && data.school.toLowerCase().includes(filterTerm)) ||
                        (data.notes && data.notes.toLowerCase().includes(filterTerm)) ||
                        data.license.toLowerCase().includes(filterTerm);
          if (!match) return;
        } else if (filterTerm && !isBooked) {
          return;
        }

        const slotEl = document.createElement('div');
        slotEl.className = "p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-colors hover:bg-slate-50/80";

        if (!isBooked) {
          slotEl.innerHTML = `
            <div class="flex items-center gap-4">
              <span class="font-mono text-sm font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md">${slot.label}</span>
              <span class="text-sm text-slate-400 italic">Nessun allievo prenotato</span>
            </div>
            <button onclick="openBooking('${slot.id}')" class="self-start sm:self-auto px-3 py-1.5 bg-brand-50 text-brand-600 hover:bg-brand-600 hover:text-white rounded-lg text-xs font-semibold border border-brand-100 transition-all flex items-center gap-1.5">
              <i class="fa-solid fa-plus"></i> Prenota
            </button>
          `;
        } else {
          let statusBadge = '';
          switch(data.status) {
            case 'completed':
              statusBadge = '<span class="px-2 py-0.5 text-xs rounded-full bg-emerald-100 text-emerald-700 font-medium">Completata</span>';
              break;
            case 'cancelled':
              statusBadge = '<span class="px-2 py-0.5 text-xs rounded-full bg-red-100 text-red-700 font-medium">Annullata</span>';
              break;
            default:
              statusBadge = '<span class="px-2 py-0.5 text-xs rounded-full bg-blue-100 text-blue-700 font-medium">Confermata</span>';
          }

          slotEl.innerHTML = `
            <div class="flex items-start sm:items-center gap-4">
              <span class="font-mono text-sm font-semibold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-md shrink-0">${slot.label}</span>
              <div class="space-y-0.5">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-bold text-slate-900">${escapeHtml(data.name)}</span>
                  ${data.school ? `<span class="px-2 py-0.5 bg-purple-50 text-purple-700 text-xs font-semibold rounded border border-purple-100"><i class="fa-solid fa-building-columns text-[10px] mr-1"></i>${escapeHtml(data.school)}</span>` : ''}
                  <span class="px-2 py-0.5 bg-slate-100 text-slate-600 text-xs font-semibold rounded">${data.license}</span>
                  ${statusBadge}
                </div>
                ${data.notes ? `<p class="text-xs text-slate-500 flex items-center gap-1"><i class="fa-regular fa-note-sticky text-slate-400"></i> ${escapeHtml(data.notes)}</p>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-2 self-end sm:self-auto">
              <button onclick="openBooking('${slot.id}')" class="p-2 text-slate-400 hover:text-brand-600 hover:bg-slate-100 rounded-lg transition-all" title="Modifica">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="deleteBooking('${slot.id}')" class="p-2 text-slate-400 hover:text-red-600 hover:bg-slate-100 rounded-lg transition-all" title="Elimina">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          `;
        }

        if (slot.period === 'morning') morningContainer.appendChild(slotEl);
        else afternoonContainer.appendChild(slotEl);
      });

      // Aggiorna metriche
      const total = SLOTS_CONFIG.length;
      const actualBooked = Object.keys(dayBookings).length;
      document.getElementById('statTotal').innerText = total;
      document.getElementById('statBooked').innerText = actualBooked;
      document.getElementById('statFree').innerText = total - actualBooked;
      document.getElementById('statOccupancy').innerText = Math.round((actualBooked / total) * 100) + '%';
    }

    function openBooking(timeSlot) {
      document.getElementById('modalTimeSlot').value = timeSlot;
      const existing = (bookings[currentDate] || {})[timeSlot];
      
      const slotObj = SLOTS_CONFIG.find(s => s.id === timeSlot);
      document.getElementById('modalSub').innerText = `Ora: ${slotObj.label} del ${currentDate}`;

      if (existing) {
        document.getElementById('studentName').value = existing.name;
        document.getElementById('schoolName').value = existing.school || '';
        document.getElementById('licenseType').value = existing.license;
        document.getElementById('bookingStatus').value = existing.status || 'confirmed';
        document.getElementById('bookingNotes').value = existing.notes || '';
      } else {
        bookingForm.reset();
        document.getElementById('modalTimeSlot').value = timeSlot;
      }

      bookingModal.classList.remove('hidden');
    }

    function deleteBooking(timeSlot) {
      if (confirm("Vuoi cancellare questa prenotazione?")) {
        if (bookings[currentDate]) {
          delete bookings[currentDate][timeSlot];
          if (Object.keys(bookings[currentDate]).length === 0) {
            delete bookings[currentDate];
          }
          saveToStorage();
          renderAgenda();
        }
      }
    }

    bookingForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const timeSlot = document.getElementById('modalTimeSlot').value;
      
      if (!bookings[currentDate]) bookings[currentDate] = {};

      bookings[currentDate][timeSlot] = {
        name: document.getElementById('studentName').value,
        school: document.getElementById('schoolName').value,
        license: document.getElementById('licenseType').value,
        status: document.getElementById('bookingStatus').value,
        notes: document.getElementById('bookingNotes').value
      };

    // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBXXK6mvn4_4eY2NcogvLVhsih0hBDvGpU",
  authDomain: "agenda-guide.firebaseapp.com",
  projectId: "agenda-guide",
  storageBucket: "agenda-guide.firebasestorage.app",
  messagingSenderId: "46794941870",
  appId: "1:46794941870:web:24604cd526f9896409d43f"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
    });

    // Event Listeners Navigazione Data
    datePicker.addEventListener('change', (e) => {
      currentDate = e.target.value;
      renderAgenda();
    });

    document.getElementById('prevDay').addEventListener('click', () => {
      const d = new Date(currentDate);
      d.setDate(d.getDate() - 1);
      currentDate = d.toISOString().split('T')[0];
      datePicker.value = currentDate;
      renderAgenda();
    });

    document.getElementById('nextDay').addEventListener('click', () => {
      const d = new Date(currentDate);
      d.setDate(d.getDate() + 1);
      currentDate = d.toISOString().split('T')[0];
      datePicker.value = currentDate;
      renderAgenda();
    });

    searchInput.addEventListener('input', renderAgenda);

    document.getElementById('closeModal').addEventListener('click', () => bookingModal.classList.add('hidden'));
    document.getElementById('cancelModal').addEventListener('click', () => bookingModal.classList.add('hidden'));

    document.getElementById('clearDayBtn').addEventListener('click', () => {
      if (confirm(`Sei sicuro di voler cancellare tutte le prenotazioni del ${currentDate}?`)) {
        delete bookings[currentDate];
        saveToStorage();
        renderAgenda();
      }
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bookings, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `agenda_guide_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Primo avvio
    renderAgenda();
  </script>
</body>
</html>
